name: Pre-release portability

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portability-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  msrv:
    name: Test and lint on minimum Rust 1.89
    runs-on: ubuntu-22.04
    steps:
      - name: Check out the source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install minimum supported Rust 1.89
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: 1.89.0
          components: clippy
          rustflags: ''

      - name: Test the locked workspace on the MSRV
        run: cargo test --workspace --all-targets --all-features --locked

      - name: Deny Clippy warnings on the MSRV
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  release-binary:
    name: Link and smoke-test ${{ matrix.target }} (${{ matrix.allocator }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rustflags: '-Ctarget-cpu=x86-64'
            allocator: system
            features: ''
          - runner: macos-14
            target: aarch64-apple-darwin
            rustflags: '-Ctarget-cpu=apple-m1'
            allocator: system
            features: ''
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            rustflags: '-Ctarget-cpu=penryn'
            allocator: system
            features: ''
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            rustflags: '-Ctarget-cpu=x86-64 -Ctarget-feature=+crt-static'
            allocator: system
            features: ''
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            rustflags: '-Ctarget-cpu=x86-64 -Ctarget-feature=+crt-static -Clink-self-contained=yes'
            allocator: system
            features: ''
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            rustflags: '-Ctarget-cpu=x86-64 -Ctarget-feature=+crt-static'
            allocator: mimalloc
            features: mimalloc
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            rustflags: '-Ctarget-cpu=x86-64 -Ctarget-feature=+crt-static -Clink-self-contained=yes'
            allocator: mimalloc
            features: mimalloc
    steps:
      - name: Check out the source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install Rust 1.89 and the release target
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: 1.89.0
          target: ${{ matrix.target }}
          rustflags: ''

      - name: Install the musl linker
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools

      - name: Link the release binary
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: >-
          cargo build --locked --profile dist --package gravlax --bin aie
          --target ${{ matrix.target }} --no-default-features --features "${{ matrix.features }}"

      - name: Install Python for executable acceptance
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Execute GQ and relocated collection acceptance
        shell: bash
        run: >-
          python packaging/gq_smoke.py
          --binary "target/${{ matrix.target }}/dist/aie${{ runner.os == 'Windows' && '.exe' || '' }}"

      - name: Smoke-test the Windows executable
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: bash
        run: |
          set -euo pipefail
          binary='target/x86_64-pc-windows-msvc/dist/aie.exe'
          "${binary}" --version
          "${binary}" completions bash > aie.bash
          test -s aie.bash

      - name: Smoke-test the static musl executable
        if: matrix.target == 'x86_64-unknown-linux-musl'
        shell: bash
        run: |
          set -euo pipefail
          binary='target/x86_64-unknown-linux-musl/dist/aie'
          "${binary}" --version
          "${binary}" completions bash > aie.bash
          test -s aie.bash
          readelf --program-headers "${binary}" > musl-program-headers.txt
          if grep --quiet 'Requesting program interpreter' musl-program-headers.txt; then
            echo 'The musl release binary is dynamically linked' >&2
            exit 1
          fi

  distribution-checks:
    name: Validate release source, Python, documentation and container
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/release-checks.yml
