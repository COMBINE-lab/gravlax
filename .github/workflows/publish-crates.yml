name: Publish Rust crates

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish the Gravlax crate graph
    runs-on: ubuntu-22.04
    environment: crates-io
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install Rust 1.89
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: 1.89.0
          rustflags: ''

      - name: Install Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Validate the tagged version and inspect registry state
        id: registry
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="$(python3 packaging/release_version.py --tag "${RELEASE_TAG}")"
          missing=false
          for crate in gravlax-evidence-io gravlax-output gravlax-anno gravlax-ingest gravlax; do
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --user-agent 'gravlax-release-workflow/1.0 (+https://github.com/COMBINE-lab/gravlax)' \
              "https://crates.io/api/v1/crates/${crate}/${version}")"
            case "${status}" in
              200) ;;
              404) missing=true ;;
              *) echo "Unexpected crates.io response for ${crate}: HTTP ${status}" >&2; exit 1 ;;
            esac
          done
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "missing=${missing}" >> "${GITHUB_OUTPUT}"

      - name: Download the assembled release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: artifacts-*
          path: dist/release-candidate
          merge-multiple: true

      - name: Verify the complete immutable release set
        env:
          VERSION: ${{ steps.registry.outputs.version }}
        run: |
          rm -f dist/release-candidate/*-dist-manifest.json
          python3 packaging/verify_complete_release_set.py \
            dist/release-candidate --version "${VERSION}"

      - name: Obtain a short-lived crates.io credential
        if: steps.registry.outputs.missing == 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Verify or publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          VERSION: ${{ steps.registry.outputs.version }}
        run: |
          crate_status() {
            curl --silent --output /dev/null --write-out '%{http_code}' \
              --user-agent 'gravlax-release-workflow/1.0 (+https://github.com/COMBINE-lab/gravlax)' \
              "https://crates.io/api/v1/crates/${1}/${VERSION}"
          }
          crate_checksum() {
            curl --silent --show-error --fail --location \
              --user-agent 'gravlax-release-workflow/1.0 (+https://github.com/COMBINE-lab/gravlax)' \
              "https://crates.io/api/v1/crates/${1}/${VERSION}" | jq -er '.version.checksum'
          }
          wait_until_visible() {
            delay=2
            for attempt in {1..20}; do
              status="$(crate_status "${1}")"
              case "${status}" in
                200) return 0 ;;
                404) echo "Waiting for crates.io to expose ${1} ${VERSION} (${attempt}/20)" ;;
                *) echo "Unexpected crates.io response for ${1}: HTTP ${status}" >&2; return 1 ;;
              esac
              sleep "${delay}"
              if (( delay < 15 )); then
                delay=$((delay * 2))
                if (( delay > 15 )); then delay=15; fi
              fi
            done
            echo "Timed out waiting for crates.io to expose ${1} ${VERSION}" >&2
            return 1
          }
          for crate in gravlax-evidence-io gravlax-output gravlax-anno gravlax-ingest gravlax; do
            cargo package --locked --package "${crate}"
            archive="target/package/${crate}-${VERSION}.crate"
            test -f "${archive}"
            expected_checksum="$(sha256sum "${archive}" | cut -d ' ' -f 1)"
            status="$(crate_status "${crate}")"
            if [[ "${status}" == 200 ]]; then
              actual_checksum="$(crate_checksum "${crate}")"
              if [[ "${actual_checksum}" != "${expected_checksum}" ]]; then
                echo "crates.io ${crate} ${VERSION} does not match the tagged package" >&2
                exit 1
              fi
              echo "${crate} ${VERSION} already has the exact tagged package; skipping"
            elif [[ "${status}" == 404 ]]; then
              cargo publish --locked --package "${crate}"
              wait_until_visible "${crate}"
              actual_checksum="$(crate_checksum "${crate}")"
              if [[ "${actual_checksum}" != "${expected_checksum}" ]]; then
                echo "published checksum for ${crate} ${VERSION} does not match" >&2
                exit 1
              fi
            else
              echo "Unexpected crates.io response for ${crate}: HTTP ${status}" >&2
              exit 1
            fi
          done
