name: Release checks

on:
  workflow_call:
    inputs:
      plan:
        required: false
        type: string

permissions:
  contents: read

jobs:
  test:
    name: Test source and distributions
    runs-on: ubuntu-22.04
    steps:
      - name: Check out the release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust 1.98
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: 1.98.0
          rustflags: ''

      - name: Install Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.19'
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Verify the annotated release tag
        if: github.event_name != 'pull_request'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 packaging/release_version.py --tag "${RELEASE_TAG}"
          test "$(git cat-file -t "refs/tags/${RELEASE_TAG}")" = tag
          test "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")" = "${GITHUB_SHA}"

      - name: Validate versions, package graph, and public-source policy
        run: ./scripts/bump-and-publish --check-only --check-history

      - name: Test all Rust targets
        run: cargo test --workspace --all-targets --locked

      - name: Test distribution tooling
        run: python -m unittest discover -s packaging/tests -p 'test_*.py' -v

      - name: Build documentation
        working-directory: docs
        run: |
          npm ci
          npm run build

  python:
    name: Test Python ${{ matrix.python }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - name: Check out the release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install Python ${{ matrix.python }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install Python test dependencies
        run: python -m pip install --disable-pip-version-check -e './python[test]'

      - name: Test the Python client
        run: python -m unittest discover -s python/tests -p 'test_*.py' -v

  container:
    name: Validate container installation
    needs: [test, python]
    runs-on: ubuntu-22.04
    steps:
      - name: Check out the release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Build without publishing
        env:
          IMAGE: gravlax-release-check:${{ github.sha }}
        run: docker build --pull --file Dockerfile --tag "${IMAGE}" .

      - name: Smoke-test the installed executable
        env:
          IMAGE: gravlax-release-check:${{ github.sha }}
        run: |
          docker run --rm "${IMAGE}" --version
          docker run --rm "${IMAGE}" completions bash
