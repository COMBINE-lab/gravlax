[workspace]
resolver = "2"
members = [
    "crates/evidence-io",
    "crates/anno",
    "crates/ingest",
    "crates/replay",
    "crates/eval",
    "crates/gravlax-output",
    "crates/aie",
]

[workspace.package]
version = "0.1.3"
edition = "2021"
rust-version = "1.98"
authors = ["Gravlax contributors"]
license = "BSD-3-Clause"
repository = "https://github.com/COMBINE-lab/gravlax"
homepage = "https://combine-lab.github.io/gravlax/"
readme = "README.md"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
zstd = "0.13"
rustc-hash = "2"
hashbrown = "0.17"
smallvec = { version = "1", features = ["union"] }
libc = "0.2"
blake3 = "1"
flate2 = "1"
resvg = "0.48"
noodles-bam = "0.95"
noodles-sam = "0.90"
noodles-bgzf = "0.51"
noodles-core = "0.20"
noodles-gtf = "0.57"
evidence-io = { package = "gravlax-evidence-io", version = "=0.1.3", path = "crates/evidence-io" }
anno = { package = "gravlax-anno", version = "=0.1.3", path = "crates/anno" }
ingest = { package = "gravlax-ingest", version = "=0.1.3", path = "crates/ingest" }
gravlax-output = { version = "=0.1.3", path = "crates/gravlax-output" }

# cargo-dist owns the native archives and installers. Release-specific checks,
# Python artifacts, the vendored source archive, and crates.io publication are
# reusable workflows composed into cargo-dist's generated lifecycle. PyPI is a
# protected top-level dispatch after the immutable GitHub release is complete.
[workspace.metadata.dist]
cargo-dist-version = "0.32.0"
ci = "github"
hosting = "github"
installers = ["shell", "powershell"]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "x86_64-pc-windows-msvc",
]
install-path = "CARGO_HOME"
install-updater = false
unix-archive = ".tar.gz"
windows-archive = ".zip"
checksum = "sha256"
source-tarball = false
pr-run-mode = "plan"
github-attestations = true
github-release = "announce"
min-glibc-version = { "x86_64-unknown-linux-gnu" = "2.35" }
local-artifacts-jobs = ["./release-checks"]
global-artifacts-jobs = ["./build-release-extras"]
publish-jobs = ["./publish-crates"]
github-build-setup = "cargo-dist/release-build-setup.yml"
github-custom-job-permissions = { build-release-extras = { attestations = "write", contents = "read", id-token = "write" }, publish-crates = { contents = "read", id-token = "write" } }

[workspace.metadata.dist.github-action-commits]
"actions/checkout" = "d23441a48e516b6c34aea4fa41551a30e30af803"
"actions/upload-artifact" = "043fb46d1a93c77aae656e7c1c64a875d1fc6a0a"
"actions/download-artifact" = "3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c"
"actions/attest" = "1e69f48acb82d1966a394da916b4c1698aa569d6"


[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
debug = 1

[profile.dist]
inherits = "release"
